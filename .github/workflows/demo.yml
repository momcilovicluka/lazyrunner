name: demo

# Records the README's demo with VHS: the real lazyrunner, on the demo shop (examples/demo), in a real terminal. It
# runs by hand, and when the tape or the demo changes on rust, and replaces demo.gif on the `demo` release, where the
# README shows it from - so the GIF never lands in git's history.
on:
  workflow_dispatch:
  push:
    branches: [rust]
    paths:
      - docs/demo.tape
      - examples/demo/**
      - .github/workflows/demo.yml

permissions:
  contents: write # replacing the demo release's GIF

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build lazyrunner
        run: |
          cargo build --release -p lazyrunner
          sudo cp target/release/lazyrunner /usr/local/bin/
      - name: Restore the demo's NuGet packages (a first build would, more slowly)
        working-directory: examples/demo
        run: |
          dotnet restore services/Orders/Orders.csproj
          dotnet restore services/Billing/Billing.csproj
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape
          install-fonts: true
      - name: Replace the README's GIF
        run: gh release upload demo docs/demo.gif --clobber
        env:
          GH_TOKEN: ${{ github.token }}
