# After a release: the Scoop manifest in bucket/ (this repo is the bucket) and the winget package. release.yml calls
# it with the release plan (cargo-dist's custom publish job: `publish-jobs` in dist-workspace.toml). The Homebrew
# formula is cargo-dist's own job.
name: publish-packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  scoop:
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      # The release's own commit: the script that writes the manifest is the one released with it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Write the manifest
        run: |
          gh release download "$TAG" --pattern '*-pc-windows-msvc.zip' --dir "$RUNNER_TEMP/zips"
          python3 packaging/scoop_manifest.py "$TAG" \
            "$RUNNER_TEMP/zips/lazyrunner-x86_64-pc-windows-msvc.zip" \
            "$RUNNER_TEMP/zips/lazyrunner-aarch64-pc-windows-msvc.zip" > "$RUNNER_TEMP/lazyrunner.json"
      # It goes to main, where `scoop bucket add` reads it.
      - name: Commit it to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          mkdir -p bucket
          cp "$RUNNER_TEMP/lazyrunner.json" bucket/lazyrunner.json
          git add bucket/lazyrunner.json
          if git diff --cached --quiet; then
            echo "bucket/lazyrunner.json is already up to date"
            exit 0
          fi
          git commit -m "chore: scoop manifest for $TAG"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            echo "push refused (attempt $attempt) - rebasing on the new main"
            git pull --rebase origin main
          done
          echo "::error::couldn't push bucket/lazyrunner.json to main (branch protection?)"
          exit 1

  winget:
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # A classic token with public_repo, for the fork of microsoft/winget-pkgs it opens the pull request from.
      # Without it this job does nothing. The first version goes into winget-pkgs by hand (README, "Releasing").
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: momcilovicluka.lazyrunner
          installers-regex: '-pc-windows-msvc\.zip$'
          release-tag: ${{ fromJson(inputs.plan).announcement_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
