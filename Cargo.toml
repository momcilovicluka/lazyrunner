[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.44.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/momcilovicluka/lazyrunner"
publish = false

# One version of what more than one crate uses; each crate picks the features it needs.
[workspace.dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
lazyrunner-core = { path = "crates/lazyrunner-core" }
lazyrunner-ui = { path = "crates/lazyrunner-ui" }
ratatui = "0.30.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = "1.53.3"
windows-sys = "0.61.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds keep line numbers for backtraces, not full debug info: a binary a fraction of the size, quicker
# to link, copy and scan (the update tests copy it around).
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# The self-update hashes and unpacks the whole binary: fast enough in debug builds (the tests) too.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
