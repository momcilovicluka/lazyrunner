[package]
name = "lazyrunner"
description = "Runs your project's apps side by side in one terminal"
homepage = "https://github.com/momcilovicluka/lazyrunner"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
lazyrunner-core = { path = "../lazyrunner-core" }
lazyrunner-ui = { path = "../lazyrunner-ui" }
ratatui = "0.30.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
flate2 = "1.1.10"
lazyrunner-core = { path = "../lazyrunner-core", features = ["test-support"] }
tar = "0.4.46"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[package.metadata.dist]
# The workspace is publish = false (nothing goes to crates.io), but the binary ships in GitHub Releases.
dist = true
