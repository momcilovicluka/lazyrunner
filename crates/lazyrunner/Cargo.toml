[package]
name = "lazyrunner"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
lazyrunner-core = { path = "../lazyrunner-core" }
lazyrunner-ui = { path = "../lazyrunner-ui" }
ratatui = "0.30.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
lazyrunner-core = { path = "../lazyrunner-core", features = ["test-support"] }
