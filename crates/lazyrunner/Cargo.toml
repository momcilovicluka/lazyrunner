[package]
name = "lazyrunner"
description = "Runs your project's apps side by side in one terminal"
homepage = "https://github.com/momcilovicluka/lazyrunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
lazyrunner-core.workspace = true
lazyrunner-ui.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
flate2.workspace = true
lazyrunner-core = { workspace = true, features = ["test-support"] }
tar.workspace = true
zip.workspace = true

[package.metadata.dist]
# The workspace is publish = false (nothing goes to crates.io), but the binary ships in GitHub Releases.
dist = true
