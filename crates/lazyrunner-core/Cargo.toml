[package]
name = "lazyrunner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The sample profile and repo, and temp folders, for the tests of the crates that use this one.
test-support = []

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
flate2.workspace = true
interprocess = { version = "2.4.5", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
listeners = "0.6.1"
notify = "8"
regex = "1.13.1"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sysinfo = "0.39.6"
tar.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zip.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
