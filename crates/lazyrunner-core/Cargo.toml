[package]
name = "lazyrunner-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The sample profile and repo, and temp folders, for the tests of the crates that use this one.
test-support = []

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
flate2 = "1.1.10"
interprocess = { version = "2.4.5", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
listeners = "0.6.1"
notify = "8"
regex = "1.13.1"
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = "0.39.6"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "fs"] }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
