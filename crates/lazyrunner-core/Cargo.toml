[package]
name = "lazyrunner-core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The sample profile and repo, and temp folders, for the tests of the crates that use this one.
test-support = []

[dependencies]
anyhow = "1.0.104"
interprocess = { version = "2.4.5", features = ["tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
