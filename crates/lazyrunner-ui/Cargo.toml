[package]
name = "lazyrunner-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arboard = { version = "3.7.0", default-features = false }
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
lazyrunner-core.workspace = true
notify-rust = "4.18.2"
ratatui.workspace = true
regex = "1.13.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Media", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1.49.0"
lazyrunner-core = { workspace = true, features = ["test-support"] }
