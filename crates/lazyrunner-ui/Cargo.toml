[package]
name = "lazyrunner-ui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
lazyrunner-core = { path = "../lazyrunner-core" }
notify-rust = "4.18.2"
ratatui = "0.30.2"
serde_json = "1.0.154"
tachyonfx = { version = "0.25.2", features = ["std-duration"] }
tokio = { version = "1.53.3", features = ["full"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
insta = "1.49.0"
lazyrunner-core = { path = "../lazyrunner-core", features = ["test-support"] }
