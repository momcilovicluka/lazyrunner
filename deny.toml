# cargo deny check: the crates lazyrunner ships with carry licenses it may ship (licenses), come from crates.io only
# (sources), and aren't pulled in twice in clashing ways (bans); `advisories` reports known vulnerabilities.

[graph]
all-features = true

[advisories]
ignore = [
    # notify-rust's Linux notifications (zbus) use these; no maintained replacement yet, nothing in them to fix.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained: through notify-rust on Linux, no replacement yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained: through notify-rust on Linux, no replacement yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained: through notify-rust on Linux, no replacement yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# lazyrunner's own crates aren't published; their license is the LICENSE file.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# lazyrunner's crates use each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
